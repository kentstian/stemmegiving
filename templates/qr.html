{% extends 'base.html' %}
{% block title %}{{ ui('qr_code_btn') }} – {{ poll.title }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center;">
    <h1>{{ ui('qr_code_btn') }}</h1>
    <h2>{{ poll.title }}</h2>
    <p>Scan this code to open the voting page.</p>
    <div style="margin:24px auto;display:inline-block;padding:20px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;">
        <img src="{{ url_for('static', filename='qr/' ~ qr_filename) }}"
             alt="QR code" style="max-width:280px;width:100%;display:block;">
    </div>
    <p>
        <a class="button" href="{{ url_for('static', filename='qr/' ~ qr_filename) }}" download>
            ⬇ Download QR code
        </a>
    </p>
    <p style="word-break:break-all;color:#475569;font-size:14px;">
        <a href="{{ vote_url }}">{{ vote_url }}</a>
    </p>
    <p style="margin-top:20px;">
        <a class="button secondary" href="{{ url_for('edit_poll', poll_id=poll.id) }}">{{ ui('back_to_poll') }}</a>
    </p>
</div>
{% endblock %}
